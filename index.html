<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
        initial-scale=1,
        maximum-scale=1,
        user-scalable=no,
        viewport-fit=cover">

  <title>Water Splash</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- 背景 -->
  <img id="background" src="background.png" alt="">

  <!-- 水のエフェクト -->
  <canvas id="waterCanvas"></canvas>

  <!-- 上部UI -->
  <div class="top-ui">

    <label class="button">
      背景を変更
      <input
        id="backgroundInput"
        type="file"
        accept="image/*"
        hidden
      >
    </label>

    <button id="resetButton" class="button">
      リセット
    </button>

  </div>

  <!-- 水量 -->
  <div class="control-panel">

    <div class="water-title">
      <span>水量</span>
      <span id="waterValue">55%</span>
    </div>

    <input
      id="waterAmount"
      type="range"
      min="10"
      max="100"
      value="55"
    >

    <div class="description">
      画面をタップしてください
    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
