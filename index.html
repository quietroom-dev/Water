<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07121b">
  <title>Water Splash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <img id="background" src="background.png" alt="">
    <canvas id="waterCanvas"></canvas>

    <header class="topbar">
      <label class="button">
        <span>🖼️</span>
        背景を変更
        <input id="backgroundInput" type="file" accept="image/*" hidden>
      </label>
      <button id="resetButton" class="button" type="button">↻ リセット</button>
    </header>

    <section class="controls" aria-label="水量設定">
      <div class="water-label">
        <span>水量</span>
        <span id="waterValue">55%</span>
      </div>
      <input id="waterAmount" type="range" min="10" max="100" value="55">
      <div class="hint">画面をタップすると、中央から水が飛んできます</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
